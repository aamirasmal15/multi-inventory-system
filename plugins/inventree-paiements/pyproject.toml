[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-paiements"
version = "0.3.0"
description = "Plugin InvenTree : achat d'articles vendables depuis la Scannette (SumUp ou HelloAsso)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Aamir ASMAL" }]
keywords = ["inventree", "plugin", "paiement", "sumup", "helloasso"]
requires-python = ">=3.9"
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

# Entrypoint qui rend le plugin decouvrable par InvenTree
[project.entry-points."inventree_plugins"]
PaiementsPlugin = "inventree_paiements.core:PaiementsPlugin"

[tool.setuptools.packages.find]
include = ["inventree_paiements*"]

# Templates du recu (PDF et e-mail)
[tool.setuptools.package-data]
inventree_paiements = ["templates/**/*"]
