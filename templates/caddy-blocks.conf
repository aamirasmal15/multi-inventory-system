# Blocs Caddy frontaux, un par section (### nom ###). create-asso.sh en extrait
# UN bloc à la fois (voir extract_section) puis substitue __HOST__ / __NAME__ /
# __SCAN_HOST__ / __SCAN_HOST_ALT__ avant de l'ajouter à ~/front/Caddyfile.
#
# - mobile            : InvenTree + Scannette montée sous /scannette/ + redirection auto mobile
# - simple            : InvenTree seul (asso sans Scannette)
# - scannette         : ancien sous-domaine Scannette -> redirection vers __HOST__/scannette/
# - scannette-alias   : idem, avec l'alias "scanette" (1 seul n) sur le même bloc
# - fallback          : hôte inconnu -> page 404 (bloc unique, pas lié à une asso)

### mobile ###

__HOST__ {
    # Scannette montée sous /scannette/ (même origine qu'InvenTree) + redirection
    # AUTO des mobiles depuis la SEULE racine /. L'accueil /web passe TOUJOURS :
    # c'est la porte de forçage desktop, tapée à la main et attendue comme telle.
    # (Elle a été interceptée quelques heures le 2026-08-21 pour contrer
    # l'autocomplétion ; abandonné, ça cassait le forçage manuel — et la page
    # « Mobile viewport detected » d'InvenTree étant désormais désactivée
    # (mobile_mode=allow-always), y atterrir donne une UI desktop propre.)
    # Tout lien profond passe direct (emails de confirmation/réinitialisation,
    # fiches d'objets, callbacks OIDC, /api, /web/home…). Forçage PERMANENT sur
    # un appareil : /inventree (alias /inventaire) ou ?desktop=1 — les deux
    # posent le cookie inv_desktop (1 an) qui désactive aussi l'aiguillage de /.
    # 302 obligatoire (un 301 serait caché edge/navigateur -> route figée) +
    # no-store : la réponse varie par User-Agent, ignoré de la clé de cache.
    # NB : pas de ligne vide DANS ce bloc (nettoyage awk RS="" de create-asso.sh).
    # Porte inverse de /web : revenir à la Scannette efface le cookie inv_desktop,
    # sinon un /inventree (ou ?desktop=1) posé une fois débranchait l'aiguillage
    # de / pour un an, sans aucun moyen de revenir hors purge des cookies.
    @scanEntry path /scannette /scannette/ /scanette /scanette/
    header @scanEntry +Set-Cookie "inv_desktop=; Path=/; Max-Age=0; SameSite=Lax"
    redir /scannette /scannette/ 302
    redir /scanette /scannette/ 302
    redir /scanette/ /scannette/ 302
    handle_path /scannette/* {
        reverse_proxy __NAME__-scan:80
    }
    @invForce path /inventree /inventree/ /inventaire /inventaire/
    handle @invForce {
        header +Set-Cookie "inv_desktop=1; Path=/; Max-Age=31536000; SameSite=Lax"
        header Cache-Control "no-store"
        redir * /web 302
    }
    @desktopForce {
        path / /web /web/
        query desktop=1
    }
    header @desktopForce +Set-Cookie "inv_desktop=1; Path=/; Max-Age=31536000; SameSite=Lax"
    @mobileEntry {
        method GET
        path /
        header Sec-Fetch-Dest document
        header_regexp User-Agent (?i)(android|iphone|ipod|mobile)
        not query desktop=1
        not header_regexp Cookie (?:^|;\s?)inv_desktop=
    }
    handle @mobileEntry {
        header Cache-Control "no-store"
        redir * /scannette/ 302
    }
    @mediaToken {
        path /media/*
        header_regexp tok Cookie (?:^|;\s?)eir_token=([^;]+)
        not header_regexp Cookie (?:^|;\s?)sessionid=
        not header Authorization *
    }
    handle @mediaToken {
        reverse_proxy __NAME__-proxy:80 {
            header_up Authorization "Token {re.tok.1}"
        }
    }
    reverse_proxy __NAME__-proxy:80
}

### simple ###

__HOST__ {
    reverse_proxy __NAME__-proxy:80
}

### scannette-alias ###

__SCAN_HOST__, __SCAN_HOST_ALT__ {
    # Sous-domaine HISTORIQUE de la Scannette : il ne sert plus l'app, il renvoie
    # vers le montage same-origin /scannette/ de l'inventaire (le lien de forçage
    # de la Scannette), seule adresse maintenue. Conservé uniquement pour que les
    # liens déjà diffusés dans les guides continuent de tomber juste, le temps de
    # les remplacer : l'adresse a vocation à disparaître.
    # {uri} préservé : la racine donne /scannette/ (qui efface au passage le cookie
    # inv_desktop, cf. @scanEntry du bloc InvenTree) et les liens profonds arrivent
    # à bon port — dont le callback OIDC /accounts/<provider>/login/callback/,
    # enregistré chez Dex sur CET hôte : la redirection le ramène sur l'origine qui
    # porte la session (sans quoi un SSO lancé depuis le montage échouait).
    # 302 délibéré : un 301 se fige dans les navigateurs et à l'edge, sans retour
    # arrière possible tant que l'adresse existe encore.
    # Nettoyage idempotent : marqueur EIR-SCAN-__NAME__ (create-asso.sh /
    # delete-asso.sh) ; le nom de conteneur __NAME__-scan:80 reste cité ici pour
    # qu'une version antérieure de ces scripts, qui ne connaît que lui, retire
    # quand même ce bloc.
    # NB : pas de ligne vide DANS ce bloc (nettoyage awk RS="" de create-asso.sh).
    redir https://__HOST__/scannette{uri} 302
}

