# Blocs Caddy frontaux, un par section (### nom ###). create-asso.sh en extrait
# UN bloc à la fois (voir extract_section) puis substitue __HOST__ / __NAME__ /
# __SCAN_HOST__ / __SCAN_HOST_ALT__ avant de l'ajouter à ~/front/Caddyfile.
#
# - mobile            : InvenTree + Scannette montée sous /scannette/ + redirection auto mobile
# - simple            : InvenTree seul (asso sans Scannette)
# - scannette         : sous-domaine Scannette
# - scannette-alias   : sous-domaine Scannette + redirection depuis l'alias "scanette" (1 seul n)
# - fallback          : hôte inconnu -> page 404 (bloc unique, pas lié à une asso)

### mobile ###

__HOST__ {
    # Scannette montée sous /scannette/ (même origine qu'InvenTree) + redirection
    # AUTO des mobiles depuis les ENTRÉES : / ET l'accueil /web — les téléphones
    # retombaient sur /web (autocomplétion, favoris), ce qui contournait
    # l'aiguillage limité à /. Tout lien profond passe direct (emails de
    # confirmation/réinitialisation, fiches d'objets, callbacks OIDC, /api,
    # /web/home…). Forçage desktop : /inventree (alias /inventaire), symétrique
    # de /scannette, ou ?desktop=1 — les deux posent le cookie inv_desktop
    # (1 an) qui désactive l'aiguillage.
    # 302 obligatoire (un 301 serait caché edge/navigateur -> route figée) +
    # no-store : la réponse varie par User-Agent, ignoré de la clé de cache.
    # NB : pas de ligne vide DANS ce bloc (nettoyage awk RS="" de create-asso.sh).
    redir /scannette /scannette/ 302
    redir /scanette /scannette/ 302
    redir /scanette/ /scannette/ 302
    handle_path /scannette/* {
        reverse_proxy __NAME__-scan:80
    }
    @invForce path /inventree /inventree/ /inventaire /inventaire/
    handle @invForce {
        header +Set-Cookie "inv_desktop=1; Path=/; Max-Age=31536000; SameSite=Lax"
        header Cache-Control "no-store"
        redir * /web 302
    }
    @desktopForce {
        path / /web /web/
        query desktop=1
    }
    header @desktopForce +Set-Cookie "inv_desktop=1; Path=/; Max-Age=31536000; SameSite=Lax"
    @mobileEntry {
        method GET
        path / /web /web/
        header Sec-Fetch-Dest document
        header_regexp User-Agent (?i)(android|iphone|ipod|mobile)
        not query desktop=1
        not header_regexp Cookie (?:^|;\s?)inv_desktop=
    }
    handle @mobileEntry {
        header Cache-Control "no-store"
        redir * /scannette/ 302
    }
    @mediaToken {
        path /media/*
        header_regexp tok Cookie (?:^|;\s?)eir_token=([^;]+)
        not header_regexp Cookie (?:^|;\s?)sessionid=
        not header Authorization *
    }
    handle @mediaToken {
        reverse_proxy __NAME__-proxy:80 {
            header_up Authorization "Token {re.tok.1}"
        }
    }
    reverse_proxy __NAME__-proxy:80
}

### simple ###

__HOST__ {
    reverse_proxy __NAME__-proxy:80
}

### scannette-alias ###

__SCAN_HOST__, __SCAN_HOST_ALT__ {
    @alias host __SCAN_HOST_ALT__
    redir @alias https://__SCAN_HOST__{uri} 301
    reverse_proxy __NAME__-scan:80
}

### scannette ###

__SCAN_HOST__ {
    reverse_proxy __NAME__-scan:80
}

### fallback ###

# EIR-FALLBACK-404 (marqueur : create-asso.sh retire ce bloc avant de le
# réécrire). Hôte inconnu de la zone : faute de frappe, asso supprimée, vieux
# lien. Sans ce bloc, Caddy ne matche AUCUN site et répond 200 avec un corps
# vide -> page blanche, incompréhensible. Le wildcard DNS envoyant tout
# *.eirspace.fr ici, c'est le cas le plus courant après une coquille d'URL.
# Adresse de site sans hôte = la moins spécifique : tous les blocs d'asso
# gagnent, quel que soit l'ordre dans le fichier.
# Toujours en http:// (TLS terminé à l'edge en mode tunnel ; en mode direct un
# hôte inconnu n'a de toute façon pas de certificat) : ce bloc ne passe JAMAIS
# par apply_edge.
# NB : pas de ligne vide DANS ce bloc (nettoyage awk RS="" de create-asso.sh).
http:// {
    root * /srv/pages
    rewrite * /404.html
    file_server {
        status 404
    }
    header Cache-Control "no-store"
    header X-Robots-Tag "noindex"
}
