services:
    inventree-db:
        image: postgres:17
        container_name: __NAME__-db
        expose:
            - ${INVENTREE_DB_PORT:-5432}/tcp
        environment:
            - PGDATA=/var/lib/postgresql/data/pgdb
            - POSTGRES_USER=${INVENTREE_DB_USER:?Missing INVENTREE_DB_USER}
            - POSTGRES_PASSWORD=${INVENTREE_DB_PASSWORD:?Missing INVENTREE_DB_PASSWORD}
            - POSTGRES_DB=${INVENTREE_DB_NAME:?Missing INVENTREE_DB_NAME}
        volumes:
            - ${INVENTREE_EXT_VOLUME:?Missing INVENTREE_EXT_VOLUME}:/var/lib/postgresql/data/:z
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        restart: unless-stopped

    # PAS de env_file ici, exprès : Redis n'utilise AUCUNE variable du .env, et le
    # déclarer ferait recréer ce conteneur à chaque modification du .env (le script
    # en fait plusieurs en plein déploiement : SMTP, plugins...). Pendant la
    # recréation, le nom "inventree-cache" disparaît du DNS Docker -> erreurs
    # machine_registry "Name or service not known" au boot du serveur (2026-08-12).
    inventree-cache:
        image: redis:7-alpine
        container_name: __NAME__-cache
        expose:
            - ${INVENTREE_CACHE_PORT:-6379}
        volumes:
            - ${INVENTREE_EXT_VOLUME}/redis:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: always

    inventree-server:
        image: inventree/inventree:${INVENTREE_TAG:-stable}
        container_name: __NAME__-server
        expose:
            - ${INVENTREE_WEB_PORT:-8000}
        # service_healthy (pas juste started) : le serveur ne démarre qu'avec un
        # Redis qui répond à PING et un Postgres prêt. Vaut aussi pour le
        # 'docker compose run ... invoke update' de create-asso.sh.
        depends_on:
            inventree-db:
                condition: service_healthy
            inventree-cache:
                condition: service_healthy
        env_file:
            - .env
        environment:
          INVENTREE_SERVER: http://inventree-server:${INVENTREE_WEB_PORT}
        volumes:
            - ${INVENTREE_EXT_VOLUME}:/home/inventree/data:z
        restart: unless-stopped

    inventree-worker:
        image: inventree/inventree:${INVENTREE_TAG:-stable}
        container_name: __NAME__-worker
        command: invoke worker
        depends_on:
            - inventree-server
        env_file:
            - .env
        volumes:
            - ${INVENTREE_EXT_VOLUME}:/home/inventree/data:z
        restart: unless-stopped

    inventree-proxy:
        container_name: __NAME__-proxy
        image: caddy:alpine
        restart: always
        depends_on:
            - inventree-server
        env_file:
            - .env
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
            - ${INVENTREE_EXT_VOLUME}/static:/var/www/static:z
            - ${INVENTREE_EXT_VOLUME}/media:/var/www/media:z
            - ${INVENTREE_EXT_VOLUME}:/var/log:z
            - ${INVENTREE_EXT_VOLUME}:/data:z
            - ${INVENTREE_EXT_VOLUME}:/config:z
        networks:
            default: {}
            inventree-front:
                aliases:
                    - __NAME__-proxy

networks:
    inventree-front:
        external: true
